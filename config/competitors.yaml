# 竞品监测配置 — 按 OSL 业务辖区分层
lookback_hours: 24
content_limit: 500

# ══════════════════════════════════════════════════════════════
# T1 — HK 核心竞对（SFC 持牌同行，最高优先级）
# ══════════════════════════════════════════════════════════════

competitors:

  - name: "HashKey"
    region: "HK"
    tier: 1
    logo: "https://www.google.com/s2/favicons?domain=hashkey.com&sz=64"
    twitter: ["HashKeyExchange", "HashKeyGroup", "HSKChain"]
    rss: []
    web: []  # newsroom 连接超时 + support 页 Cloudflare 403，仅靠 Twitter
    api: []

  - name: "HKVAX"
    region: "HK"
    tier: 1
    logo: "https://www.google.com/s2/favicons?domain=hkvax.com&sz=64"
    twitter: ["HKVAX_Official"]
    rss: []
    web:
      - url: "https://www.hkvax.com/news"
        type: "newsroom"
    api: []

  # - name: "HKbitEX"  # 已撤回 SFC 牌照申请，域名停放，实质退出市场（2024）
