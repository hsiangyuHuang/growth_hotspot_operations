  #   tier: 1

  - name: "VDX"
    region: "HK"
    tier: 1
    logo: "https://www.google.com/s2/favicons?domain=vdx.com&sz=64"
    twitter: ["VDX_HK"]
    rss: []
    web: []
    api: []

  - name: "Bullish"
    region: "HK"
    tier: 1
    logo: "https://www.google.com/s2/favicons?domain=bullish.com&sz=64"
    twitter: ["Bullish"]
    rss: []
    web:
      - url: "https://www.bullish.com/news-insights"
        type: "newsroom"
        selectors: ["a[href*='/news-insights/']"]
    api: []

  - name: "Alchemy Pay"
    region: "HK"
    tier: 1
    logo: "https://www.google.com/s2/favicons?domain=alchemypay.org&sz=64"
    twitter: ["AlchemyPay"]
    rss: []
    web:
      - url: "https://alchemypay.org/blog"
        type: "blog"
    api: []

  - name: "First Digital Labs"
    region: "HK"
    tier: 1
    logo: "https://www.google.com/s2/favicons?domain=firstdigitallabs.com&sz=64"
