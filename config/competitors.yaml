# ══════════════════════════════════════════════════════════════
# T2 — 头部交易所（Global 站竞对，独立监控）
# ══════════════════════════════════════════════════════════════

  - name: "Binance"
    region: "GLOBAL"
    tier: 2
    logo: "https://www.google.com/s2/favicons?domain=binance.com&sz=64"
    twitter: ["binance", "_RichardTeng"]
    rss: []
    web: []
    api:
      - url: "https://www.binance.com/bapi/composite/v1/public/cms/article/list/query"
        params: { type: 1, catalogId: 48, pageNo: 1, pageSize: 20 }
        articles_path: "data.catalogs[].articles[]"
        id_field: "id"
        title_field: "title"
        date_field: "releaseDate"
        date_format: "timestamp_ms"
        url_template: "https://www.binance.com/en/support/announcement/{code}"

  - name: "OKX"
    region: "GLOBAL"
    tier: 2
    logo: "https://www.google.com/s2/favicons?domain=okx.com&sz=64"
    twitter: ["okx", "star_xu"]
    rss: []
    web: []  # 公告页连接超时（疑似地区限制），仅靠 Twitter
    api: []

  - name: "Bybit"
    region: "GLOBAL"
    tier: 2
    logo: "https://www.google.com/s2/favicons?domain=bybit.com&sz=64"
    twitter: ["Bybit_Official"]
    rss: []
    web: []
    api:
      - url: "https://api.bybit.com/v5/announcements/index"
        params: { locale: "en-US", limit: 20 }
        articles_path: "result.list[]"
        id_field: "url"
        title_field: "title"
        date_field: "publishTime"
        date_format: "timestamp_ms"
        url_template: "{url}"

  - name: "Coinbase"
    region: "GLOBAL"
    tier: 2
    logo: "https://www.google.com/s2/favicons?domain=coinbase.com&sz=64"
    twitter: ["coinbase"]
    rss:
      - url: "https://www.coinbase.com/blog/rss.xml"
        name: "Coinbase Blog"
    web: []
    api: []

  - name: "Kraken"
    region: "GLOBAL"
    tier: 2
    logo: "https://www.google.com/s2/favicons?domain=kraken.com&sz=64"
    twitter: ["KrakenExchange"]
    rss:
      - url: "https://blog.kraken.com/feed"
        name: "Kraken Blog"
    web: []
    api: []

