<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OSL 热点行动仪表板</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: { DEFAULT: '#0f1623', light: '#151c28', lighter: '#1a2235' },
          },
          fontFamily: {
            display: ['"Syne"', '"Outfit"', 'system-ui', 'sans-serif'],
            body: ['"IBM Plex Sans"', '"DM Sans"', 'system-ui', 'sans-serif'],
            mono: ['"IBM Plex Mono"', '"JetBrains Mono"', 'monospace'],
          },
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="/static/style.css?v=4">
</head>
<body class="min-h-screen bg-navy text-slate-200 font-body antialiased grid-bg">

  <!-- Hero Header -->
  <header id="hero-header" class="relative overflow-hidden border-b border-white/[0.08]">
    <div class="absolute inset-0 hero-gradient"></div>
    <div class="relative max-w-7xl mx-auto px-6 py-8">
      <div class="flex flex-col md:flex-row md:items-end justify-between gap-4">
        <div>
          <div class="flex items-center gap-2 mb-2">
            <span class="text-[10px] font-mono text-cyan-400 tracking-widest uppercase bg-cyan-500/10 border border-cyan-500/20 px-2 py-0.5 rounded">OSL Growth Intelligence</span>
            <span class="text-[10px] font-mono text-slate-500" id="header-date"></span>
          </div>
          <h1 class="text-2xl md:text-3xl font-display font-bold text-white leading-tight">热点行动仪表板</h1>
          <p class="text-sm text-slate-400 font-body mt-1" id="header-subtitle"></p>
        </div>
        <div class="flex items-center gap-4" id="hero-stats"></div>
      </div>
      <div id="date-selector" class="mt-4" style="display:none"></div>
    </div>
  </header>

  <!-- Filter Bar -->
  <div id="filter-bar" class="sticky top-0 z-20 bg-navy/95 backdrop-blur-md border-b border-white/[0.08]">
    <div class="max-w-7xl mx-auto px-6 py-3">
      <div class="flex flex-wrap items-center gap-x-4 gap-y-2">
        <div class="flex items-center gap-1.5">
          <button class="tab-btn active text-xs font-medium px-3 py-1.5 rounded-md transition-all duration-200" data-tab="today">📡 今日</button>
          <button class="tab-btn text-xs font-medium px-3 py-1.5 rounded-md transition-all duration-200" data-tab="history">📂 历史存档</button>
        </div>
        <div class="w-px h-5 bg-white/10"></div>
        <div class="flex items-center gap-1.5" id="filter-priority"><span class="text-xs text-slate-500 font-medium mr-1">优先级</span></div>
        <div class="w-px h-5 bg-white/10"></div>
        <div class="flex items-center gap-1.5" id="filter-channel"><span class="text-xs text-slate-500 font-medium mr-1">渠道</span></div>
        <div class="w-px h-5 bg-white/10"></div>
        <div class="flex items-center gap-1.5" id="filter-site"><span class="text-xs text-slate-500 font-medium mr-1">站点</span></div>
        <div class="ml-auto text-xs text-slate-500 font-mono" id="filter-count"></div>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-6 py-6">
    <div class="flex gap-6">
      <div class="flex-1 min-w-0 space-y-8" id="card-sections"></div>
      <aside class="w-72 shrink-0 hidden lg:block">
        <div class="sticky top-16 space-y-4" id="sidebar-content"></div>
      </aside>
    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-white/[0.08] mt-8">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <span class="text-[10px] text-slate-600 font-mono" id="footer-left"></span>
      <span class="text-[10px] text-slate-600 font-mono" id="footer-right"></span>
    </div>
  </footer>

<script>
window.onerror = function(msg, src, line, col, err) {
  document.body.insertAdjacentHTML('afterbegin',
    '<div style="background:#7f1d1d;color:#fca5a5;padding:12px;margin:8px;border-radius:8px;font-family:monospace;font-size:12px;white-space:pre-wrap;z-index:9999">' +
    '[JS ERROR] ' + msg + '\nFile: ' + src + ':' + line + ':' + col +
    (err && err.stack ? '\n' + err.stack : '') + '</div>');
};
</script>
<script src="/static/app.js?v=4"></script>
</body>
</html>
