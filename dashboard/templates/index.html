<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OSL Growth Hotspot Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface: {
              DEFAULT: '#141d2e',
              hover: '#1a2540',
              deep: '#0c1220',
              elevated: '#1e293b',
            },
            accent: {
              p0: '#ef4444',
              p1: '#3b82f6',
              p2: '#64748b',
              amber: '#f59e0b',
            }
          },
          fontFamily: {
            display: ['"Outfit"', 'system-ui', 'sans-serif'],
            body: ['"DM Sans"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-surface-deep text-slate-200 font-body min-h-screen antialiased">

  <!-- Noise texture overlay -->
  <div class="fixed inset-0 pointer-events-none opacity-[0.03] z-50" style="background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 256 256%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noise%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.9%22 numOctaves=%224%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noise)%22/%3E%3C/svg%3E'); background-repeat: repeat; background-size: 256px;"></div>

  <!-- Top bar -->
  <header class="sticky top-0 z-40 border-b border-white/5 backdrop-blur-xl bg-surface-deep/80">
    <div class="max-w-6xl mx-auto px-6 h-14 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div>
        <h1 class="font-display font-700 text-base tracking-tight text-white">OSL Growth Hotspot</h1>
        <span class="text-[10px] font-mono text-slate-500 tracking-widest uppercase ml-1">Command Center</span>
      </div>
      <div class="flex items-center gap-4">
        <span class="text-xs font-mono text-slate-500" id="update-time"></span>
        <div class="flex bg-surface rounded-lg p-0.5 border border-white/5">
          <button class="tab-btn active font-mono text-xs px-3 py-1.5 rounded-md transition-all duration-200" data-tab="today">TODAY</button>
          <button class="tab-btn font-mono text-xs px-3 py-1.5 rounded-md transition-all duration-200" data-tab="history">HISTORY</button>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-6">

    <!-- Summary stats bar -->
    <div id="summary-bar" class="grid grid-cols-4 gap-3 mb-6" style="display:none"></div>

    <!-- Today view -->
    <div id="today-view">
      <!-- Header (Layer 1-3) collapsible -->
      <div id="today-header-wrap" style="display:none">
        <button id="today-header-toggle" onclick="toggleHeader('today')"
          class="w-full flex items-center justify-between px-5 py-3 mb-1 rounded-xl bg-surface border border-white/5 hover:border-white/10 transition-colors group cursor-pointer">
          <div class="flex items-center gap-2">
            <svg class="w-4 h-4 text-slate-500 transition-transform duration-300" id="today-header-chevron" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
            <span class="text-sm font-medium text-slate-400 group-hover:text-slate-300 transition-colors">Layer 1-3 Analysis</span>
          </div>
          <span class="text-[10px] font-mono text-slate-600 tracking-wider">FUNNEL DETAIL</span>
        </button>
        <div id="today-header" class="prose-container rounded-xl bg-surface border border-white/5 p-6 mb-6 overflow-hidden transition-all duration-500 ease-out" style="display:none"></div>
      </div>
      <div id="today-list" class="space-y-4"></div>
    </div>

    <!-- History view -->
    <div id="history-view" style="display:none">
      <div class="flex items-center gap-3 mb-6">
        <label for="history-date" class="text-sm text-slate-400 font-medium">Select date</label>
        <input type="date" id="history-date"
          class="bg-surface border border-white/10 rounded-lg px-3 py-2 text-sm text-slate-300 font-mono focus:outline-none focus:border-accent-p1/50 focus:ring-1 focus:ring-accent-p1/20 transition-all" />
      </div>
      <div id="history-header-wrap" style="display:none">
        <button id="history-header-toggle" onclick="toggleHeader('history')"
          class="w-full flex items-center justify-between px-5 py-3 mb-1 rounded-xl bg-surface border border-white/5 hover:border-white/10 transition-colors group cursor-pointer">
          <div class="flex items-center gap-2">
            <svg class="w-4 h-4 text-slate-500 transition-transform duration-300" id="history-header-chevron" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
            <span class="text-sm font-medium text-slate-400 group-hover:text-slate-300 transition-colors">Layer 1-3 Analysis</span>
          </div>
          <span class="text-[10px] font-mono text-slate-600 tracking-wider">FUNNEL DETAIL</span>
        </button>
        <div id="history-header" class="prose-container rounded-xl bg-surface border border-white/5 p-6 mb-6 overflow-hidden transition-all duration-500 ease-out" style="display:none"></div>
      </div>
      <div id="history-list" class="space-y-4"></div>
    </div>
  </main>

<script src="/static/app.js"></script>
</body>
</html>
