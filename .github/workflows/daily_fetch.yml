name: Daily Hotspot Fetch

on:
  schedule:
    - cron: '0 1 * * *'  # UTC 01:00 = HKT 09:00
  workflow_dispatch:       # 允许手动触发

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run fetch
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_BASE: ${{ secrets.TWITTER_API_BASE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
          MANUS_API_BASE: ${{ secrets.MANUS_API_BASE }}
          MANUS_PROJECT_ID: ${{ secrets.MANUS_PROJECT_ID }}
        run: python main.py fetch

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: publish $(date +%Y-%m-%d)"
          git push
