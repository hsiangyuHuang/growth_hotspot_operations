name: Test Push Permission

on:
  workflow_dispatch:  # 只允许手动触发

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Create test file
        run: |
          mkdir -p test_output
          echo "Test run at $(date)" > test_output/test.txt
      
      - name: Commit and push test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add test_output/test.txt
          git commit -m "test: verify push permission"
          git push
      
      - name: Cleanup test file
        run: |
          git rm test_output/test.txt
          rmdir test_output
          git commit -m "test: cleanup test file"
          git push
