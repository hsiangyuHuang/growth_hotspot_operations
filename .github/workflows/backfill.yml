name: Backfill Missing result.json

on:
  workflow_dispatch:
    inputs:
      dates:
        description: 'Comma-separated dates to backfill (e.g. 2026-03-27)'
        required: true
        default: '2026-03-27'

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run backfill
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BACKFILL_DATES: ${{ github.event.inputs.dates }}
        run: python backfill_extract.py

      - name: Rebuild index + commit
        run: |
          python -c "from main import _generate_index_files; _generate_index_files()"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          shopt -s globstar
          git add data/**/*.json data/**/*.md
          git diff --cached --quiet || git commit -m "backfill: extract result.json for ${{ github.event.inputs.dates }}"
          git push
